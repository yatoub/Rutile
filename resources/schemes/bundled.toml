# Bundled color schemes: Tilix's 9 stock palettes (base16-twilight-dark,
# linux, material, monokai, orchis, solarized-dark, solarized-light, tango,
# yaru) plus Catppuccin Mocha/Latte, ported from the existing
# resources/catppuccin-{mocha,latte}.css values (Mocha) / well-known
# published palettes (the rest — Solarized, Tango, the Linux console default,
# and Catppuccin are standard/official hex values; base16-twilight, Material,
# Monokai, Orchis and Yaru are reproduced from widely-published terminal
# scheme values, NOT re-verified against Tilix's own bundled JSON since this
# sandbox has no network access — worth a visual side-by-side diff against
# real Tilix before calling this pixel-perfect).
#
# `palette` is the 16-color ANSI table: black, red, green, yellow, blue,
# magenta, cyan, white, then the bright variants in the same order.

[[scheme]]
id = "catppuccin-mocha"
name = "Catppuccin Mocha"
foreground = "#cdd6f4"
background = "#1e1e2e"
palette = [
  "#45475a", "#f38ba8", "#a6e3a1", "#f9e2af",
  "#89b4fa", "#f5c2e7", "#94e2d5", "#bac2de",
  "#585b70", "#f38ba8", "#a6e3a1", "#f9e2af",
  "#89b4fa", "#f5c2e7", "#94e2d5", "#a6adc8",
]

[[scheme]]
id = "catppuccin-latte"
